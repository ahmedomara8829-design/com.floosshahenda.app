name: Build Floos Shahenda

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - 'source/*.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract source ZIP
        shell: bash
        run: |
          set -e

          echo 'Searching for Floos Shahenda ZIP...'
          rm -rf .ci_workspace
          mkdir -p .ci_workspace/extracted

          ZIP_FILE=$(find . -maxdepth 2 -type f -name '*.zip' -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo 'ERROR: No ZIP source file found.'
            exit 1
          fi

          echo "Selected ZIP: $ZIP_FILE"
          echo 'Checking ZIP integrity...'
          unzip -t "$ZIP_FILE"

          echo 'Extracting ZIP...'
          unzip -q "$ZIP_FILE" -d .ci_workspace/extracted

          PUBSPEC=$(find .ci_workspace/extracted -type f -name 'pubspec.yaml' -print -quit)

          if [ -z "$PUBSPEC" ]; then
            echo 'ERROR: pubspec.yaml was not found inside the ZIP.'
            exit 1
          fi

          APP_DIR=$(dirname "$PUBSPEC")
          mv "$APP_DIR" .ci_workspace/app

          echo 'Flutter project detected successfully.'
          echo "Project directory: .ci_workspace/app"
          sha256sum "$ZIP_FILE"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform
        working-directory: .ci_workspace/app
        shell: bash
        run: |
          set -e

          if [ ! -d android ]; then
            echo 'Android folder not found. Generating it...'
            flutter create --platforms=android --org com.floosshahenda --project-name floos_shahenda .
          else
            echo 'Android folder already exists.'
          fi

      - name: Set permanent Application ID
        working-directory: .ci_workspace/app
        shell: bash
        run: |
          set -e

          NEW_ID='com.floosshahenda.app'

          echo "Setting Application ID to $NEW_ID"

          find android -type f \( -name '*.kt' -o -name '*.java' -o -name '*.gradle' -o -name '*.kts' -o -name '*.xml' \) -exec sed -i 's/com.floosshahenda.floos_shahenda/com.floosshahenda.app/g' {} \;
          find android -type f \( -name '*.kt' -o -name '*.java' -o -name '*.gradle' -o -name '*.kts' -o -name '*.xml' \) -exec sed -i 's/com.example.floos_shahenda/com.floosshahenda.app/g' {} \;

      - name: Install dependencies
        working-directory: .ci_workspace/app
        shell: bash
        run: |
          set -e
          flutter pub get

      - name: Generate Drift database code
        working-directory: .ci_workspace/app
        shell: bash
        run: |
          set -e

          if grep -q 'drift' pubspec.yaml; then
            dart run build_runner build --delete-conflicting-outputs
          else
            echo 'Drift not detected. Skipping code generation.'
          fi

      - name: Static analysis
        working-directory: .ci_workspace/app
        shell: bash
        run: |
          set -e
          flutter analyze lib

      - name: Build APK
        working-directory: .ci_workspace/app
        shell: bash
        run: |
          set -e
          flutter build apk --release

      - name: Build AAB
        working-directory: .ci_workspace/app
        shell: bash
        run: |
          set -e
          flutter build appbundle --release

      - name: Verify APK
        working-directory: .ci_workspace/app
        shell: bash
        run: |
          set -e
          test -f build/app/outputs/flutter-apk/app-release.apk
          echo 'APK generated successfully.'
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Verify AAB
        working-directory: .ci_workspace/app
        shell: bash
        run: |
          set -e
          test -f build/app/outputs/bundle/release/app-release.aab
          echo 'AAB generated successfully.'
          ls -lh build/app/outputs/bundle/release/app-release.aab

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: floos-shahenda-apk
          path: .ci_workspace/app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: floos-shahenda-aab
          path: .ci_workspace/app/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
