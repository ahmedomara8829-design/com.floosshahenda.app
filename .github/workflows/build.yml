name: Build Floos Shahenda

on:
  workflow_dispatch:
  push:
    paths:
      - 'source/*.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate and safely extract source ZIP
        run: |
          python3 - <<'PY'
          import hashlib, shutil, zipfile
          from pathlib import Path, PurePosixPath

          source = Path('source')
          zips = sorted(source.glob('*.zip'))
          if len(zips) != 1:
              raise SystemExit('ERROR: يجب وجود ملف ZIP واحد فقط داخل source/.')
          z = zips[0]
          work = Path('.ci_workspace')
          if work.exists(): shutil.rmtree(work)
          project = work / 'project'
          project.mkdir(parents=True)

          MAX_SIZE = 800 * 1024 * 1024
          total = 0
          with zipfile.ZipFile(z) as archive:
              bad = archive.testzip()
              if bad:
                  raise SystemExit(f'ERROR: ZIP تالف: {bad}')
              for info in archive.infolist():
                  p = PurePosixPath(info.filename)
                  if p.is_absolute() or '..' in p.parts:
                      raise SystemExit(f'ERROR: مسار غير آمن داخل ZIP: {info.filename}')
                  total += info.file_size
                  if total > MAX_SIZE:
                      raise SystemExit('ERROR: الحجم بعد فك الضغط أكبر من الحد المسموح.')
              archive.extractall(project)

          candidates = []
          if (project / 'pubspec.yaml').is_file() and (project / 'lib').is_dir():
              candidates.append(project)
          for child in project.iterdir():
              if child.is_dir() and (child / 'pubspec.yaml').is_file() and (child / 'lib').is_dir():
                  candidates.append(child)
          if len(candidates) != 1:
              raise SystemExit('ERROR: لم يتم العثور على Root واحد لمشروع Flutter صالح داخل ZIP.')

          root = candidates[0]
          app = work / 'app'
          shutil.move(str(root), str(app))
          print('ZIP SHA256:', hashlib.sha256(z.read_bytes()).hexdigest())
          print('Detected project root:', app)
          PY

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform if needed
        working-directory: .ci_workspace/app
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.floosshahenda --project-name floos_shahenda .
          fi

      - name: Enforce permanent Application ID
        working-directory: .ci_workspace/app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil

          android = Path('android')
          old = 'com.floosshahenda.floos_shahenda'
          new = 'com.floosshahenda.app'

          for p in android.rglob('*'):
              if p.is_file() and p.suffix in {'.kt', '.java', '.gradle', '.kts', '.xml'}:
                  s = p.read_text(encoding='utf-8')
                  if old in s:
                      p.write_text(s.replace(old, new), encoding='utf-8')

          old_dir = android / 'app' / 'src' / 'main' / 'kotlin' / 'com' / 'floosshahenda' / 'floos_shahenda'
          new_dir = android / 'app' / 'src' / 'main' / 'kotlin' / 'com' / 'floosshahenda' / 'app'
          if old_dir.exists():
              new_dir.parent.mkdir(parents=True, exist_ok=True)
              if new_dir.exists(): shutil.rmtree(new_dir)
              shutil.move(str(old_dir), str(new_dir))

          found = []
          for p in android.rglob('*'):
              if p.is_file() and p.suffix in {'.kt', '.java', '.gradle', '.kts', '.xml'}:
                  if new in p.read_text(encoding='utf-8'):
                      found.append(str(p))
          if not found:
              raise SystemExit('ERROR: Application ID com.floosshahenda.app لم يتم تثبيته في Android project.')
          PY

      - name: Install dependencies
        working-directory: .ci_workspace/app
        run: flutter pub get

      - name: Generate Drift database code
        working-directory: .ci_workspace/app
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Static analysis
        working-directory: .ci_workspace/app
        run: flutter analyze

      - name: Tests
        working-directory: .ci_workspace/app
        run: flutter test

      - name: Build APK
        working-directory: .ci_workspace/app
        run: flutter build apk --release

      - name: Build AAB
        working-directory: .ci_workspace/app
        run: flutter build appbundle --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: floos-shahenda-apk
          path: .ci_workspace/app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: floos-shahenda-aab
          path: .ci_workspace/app/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
