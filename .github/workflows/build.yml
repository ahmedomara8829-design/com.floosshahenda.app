name: Build Floos Shahenda

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - 'source/*.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate and safely extract latest source ZIP
        run: |
          python3 - <<'PY'
          import hashlib
          import re
          import shutil
          import zipfile
          from pathlib import Path, PurePosixPath

          candidates = (
              sorted(Path('.').glob('*.zip'))
              + sorted(Path('source').glob('*.zip'))
          )

          pattern = re.compile(
              r'^floos_shahenda_v(\d+)\.(\d+)\.(\d+)\.zip$',
              re.IGNORECASE
          )

          versioned = []

          for p in candidates:
              match = pattern.match(p.name)
              if match:
                  version = tuple(int(x) for x in match.groups())
                  versioned.append((version, p))

          if not versioned:
              raise SystemExit(
                  'ERROR: لم يتم العثور على ZIP صالح باسم '
                  'floos_shahenda_vMAJOR.MINOR.PATCH.zip'
              )

          versioned.sort(
              key=lambda item: (item[0], str(item[1]))
          )

          latest_version = versioned[-1][0]
          latest_files = [
              p for version, p in versioned
              if version == latest_version
          ]

          if len(latest_files) > 1:
              raise SystemExit(
                  'ERROR: يوجد أكثر من ZIP لنفس الإصدار.'
              )

          source_zip = latest_files[0]

          print(
              'Selected ZIP:',
              source_zip,
              'version:',
              f'v{latest_version[0]}.{latest_version[1]}.{latest_version[2]}'
          )

          workspace = Path('.ci_workspace')

          if workspace.exists():
              shutil.rmtree(workspace)

          project_root = workspace / 'project'
          project_root.mkdir(parents=True)

          MAX_SIZE = 800 * 1024 * 1024
          total_size = 0

          try:
              with zipfile.ZipFile(source_zip) as archive:

                  bad_file = archive.testzip()

                  if bad_file:
                      raise SystemExit(
                          f'ERROR: ZIP تالف: {bad_file}'
                      )

                  for info in archive.infolist():

                      path = PurePosixPath(info.filename)

                      if path.is_absolute() or '..' in path.parts:
                          raise SystemExit(
                              f'ERROR: مسار غير آمن داخل ZIP: '
                              f'{info.filename}'
                          )

                      total_size += info.file_size

                      if total_size > MAX_SIZE:
                          raise SystemExit(
                              'ERROR: حجم المشروع بعد فك الضغط كبير جدًا.'
                          )

                  archive.extractall(project_root)

          except zipfile.BadZipFile:
              raise SystemExit(
                  'ERROR: ملف ZIP غير صالح أو تالف.'
              )

          roots = []

          if (
              (project_root / 'pubspec.yaml').is_file()
              and (project_root / 'lib').is_dir()
          ):
              roots.append(project_root)

          for child in project_root.iterdir():

              if (
                  child.is_dir()
                  and (child / 'pubspec.yaml').is_file()
                  and (child / 'lib').is_dir()
              ):
                  roots.append(child)

          if len(roots) != 1:
              raise SystemExit(
                  'ERROR: لم يتم العثور على Root واحد '
                  'لمشروع Flutter صالح داخل ZIP.'
              )

          detected_root = roots[0]

          app = workspace / 'app'

          shutil.move(
              str(detected_root),
              str(app)
          )

          print(
              'ZIP SHA256:',
              hashlib.sha256(
                  source_zip.read_bytes()
              ).hexdigest()
          )

          print(
              'Detected project root:',
              app
          )
          PY

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform if needed
        working-directory: .ci_workspace/app
        run: |
          if [ ! -d android ]; then
            flutter create \
              --platforms=android \
              --org com.floosshahenda \
              --project-name floos_shahenda .
          fi

      - name: Enforce permanent Application ID
        working-directory: .ci_workspace/app
        run: |
          python3 - <<'PY'
          from pathlib import Path

          android = Path('android')

          old_id = 'com.floosshahenda.floos_shahenda'
          new_id = 'com.floosshahenda.app'

          for path in android.rglob('*'):

              if not path.is_file():
                  continue

              if path.suffix not in {
                  '.kt',
                  '.java',
                  '.gradle',
                  '.kts',
                  '.xml'
              }:
                  continue

              try:
                  text = path.read_text(
                      encoding='utf-8'
                  )
              except UnicodeDecodeError:
                  continue

              if old_id in text:
                  path.write_text(
                      text.replace(old_id, new_id),
                      encoding='utf-8'
                  )

          found = False

          for path in android.rglob('*'):

              if not path.is_file():
                  continue

              if path.suffix not in {
                  '.kt',
                  '.java',
                  '.gradle',
                  '.kts',
                  '.xml'
              }:
                  continue

              try:
                  text = path.read_text(
                      encoding='utf-8'
                  )
              except UnicodeDecodeError:
                  continue

              if new_id in text:
                  found = True
                  break

          if not found:
              raise SystemExit(
                  'ERROR: Application ID '
                  'com.floosshahenda.app '
                  'لم يتم العثور عليه.'
              )
          PY

      - name: Install dependencies
        working-directory: .ci_workspace/app
        run: flutter pub get

      - name: Generate Drift database code
        working-directory: .ci_workspace/app
        run: |
          dart run build_runner build \
            --delete-conflicting-outputs

      - name: Prepare CI smoke test
        working-directory: .ci_workspace/app
        run: |
          rm -f test/widget_test.dart
          mkdir -p test

          cat > test/smoke_test.dart <<'DART'
          import 'package:flutter_test/flutter_test.dart';
          import 'package:flutter_riverpod/flutter_riverpod.dart';
          import 'package:floos_shahenda/app.dart';

          void main() {
            testWidgets(
              'Floos Shahenda app starts',
              (tester) async {

                await tester.pumpWidget(
                  const ProviderScope(
                    child: FloosShahendaApp(),
                  ),
                );

                await tester.pumpAndSettle();

                expect(
                  find.text('💰 فلوس شاهندة'),
                  findsOneWidget,
                );
              },
            );
          }
          DART

      - name: Static analysis
        working-directory: .ci_workspace/app
        run: flutter analyze

      - name: Tests
        working-directory: .ci_workspace/app
        run: flutter test

      - name: Build APK
        working-directory: .ci_workspace/app
        run: flutter build apk --release

      - name: Build AAB
        working-directory: .ci_workspace/app
        run: flutter build appbundle --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: floos-shahenda-apk
          path: .ci_workspace/app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: floos-shahenda-aab
          path: .ci_workspace/app/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
