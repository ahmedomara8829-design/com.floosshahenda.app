name: Build Floos Shahenda

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - "source/*.zip"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate and safely extract latest source ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for Floos Shahenda ZIP..."

          mkdir -p .ci_workspace
          rm -rf .ci_workspace/project .ci_workspace/app .ci_workspace/extracted
          mkdir -p .ci_workspace/extracted

          ZIP_FILE=""

          if compgen -G "*.zip" > /dev/null; then
            ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" -printf "%f\n" | sort -V | tail -n 1)
          fi

          if [ -z "$ZIP_FILE" ] && [ -d "source" ]; then
            if compgen -G "source/*.zip" > /dev/null; then
              ZIP_FILE=$(find source -maxdepth 1 -type f -name "*.zip" -printf "%p\n" | sort -V | tail -n 1)
            fi
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No source ZIP was found."
            echo "Expected a file such as: floos_shahenda_v1.0.0.zip"
            exit 1
          fi

          echo "Selected ZIP: $ZIP_FILE"

          if ! unzip -t "$ZIP_FILE" > /dev/null; then
            echo "ERROR: ZIP file is corrupted or invalid."
            exit 1
          fi

          echo "Checking ZIP paths..."

          if unzip -Z1 "$ZIP_FILE" | grep -E '(^/|(^|/)\.\.(\/|$))' > /dev/null; then
            echo "ERROR: Unsafe path detected inside ZIP."
            exit 1
          fi

          echo "Extracting ZIP..."
          unzip -q "$ZIP_FILE" -d .ci_workspace/extracted

          ROOT_COUNT=0
          APP_SOURCE=""

          if [ -f ".ci_workspace/extracted/pubspec.yaml" ] && [ -d ".ci_workspace/extracted/lib" ]; then
            ROOT_COUNT=1
            APP_SOURCE=".ci_workspace/extracted
