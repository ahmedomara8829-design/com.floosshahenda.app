name: Build Floos Shahenda

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - 'source/*.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract source ZIP
        shell: bash
        run: |
          set -e

          echo "Searching for Floos Shahenda ZIP..."
          mkdir -p .ci_workspace
          rm -rf .ci_workspace/app .ci_workspace/extracted
          mkdir -p .ci_workspace/extracted

          ZIP_FILE=""

          for FILE in ./*.zip; do
            if [ -f "$FILE" ]; then
              ZIP_FILE="$FILE"
            fi
          done

          if [ -z "$ZIP_FILE" ] && [ -d "source" ]; then
            for FILE in ./source/*.zip; do
              if [ -f "$FILE" ]; then
                ZIP_FILE="$FILE"
              fi
            done
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP source file found."
            exit 1
          fi

          echo "Selected ZIP: $ZIP_FILE"
          echo "Checking ZIP..."
          unzip -t "$ZIP_FILE"

          echo "Extracting ZIP..."
          unzip -q
