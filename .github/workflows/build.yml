name: Build Floos Shahenda

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - 'source/*.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate and safely extract latest source ZIP
        run: |
          python3 - <<'PY'
          import hashlib
          import re
          import shutil
          import zipfile
          from pathlib import Path, PurePosixPath

          candidates = (
              sorted(Path('.').glob('*.zip'))
              + sorted(Path('source').glob('*.zip'))
          )

          pattern = re.compile(
              r'^floos_shahenda_v(\d+)\.(\d+)\.(\d+)\.zip$',
              re.IGNORECASE
          )

          versioned = []

          for p in candidates:
              if not p.is_file():
                  continue

              match = pattern.match(p.name)

              if match:
                  versioned.append(
                      (tuple(map(int, match.groups())), p)
                  )

          if not versioned:
              raise SystemExit(
                  'ERROR: لم يتم العثور على ZIP صالح باسم '
                  'floos_shahenda_vMAJOR.MINOR.PATCH.zip'
              )

          versioned.sort(
              key=lambda item: (item[0], str(item[1]))
          )

          latest_version = versioned[-1][0]

          latest_files = [
              p for v, p in versioned
              if v == latest_version
          ]

          if len(latest_files) > 1:
              raise SystemExit(
                  'ERROR: يوجد أكثر من ZIP لنفس الإصدار.'
              )

          source_zip = latest_files[0]

          print('Selected ZIP:', source_zip)

          workspace = Path('.ci_workspace')

          if workspace.exists():
              shutil.rmtree(workspace)

          project_root = workspace / 'project'
          project_root.mkdir(parents=True)

          max_size = 800 * 1024 * 1024
          total_size = 0

          try:
              with zipfile.ZipFile(source_zip) as archive:
                  bad_file = archive.testzip()

                  if bad_file:
                      raise SystemExit(
                          f'ERROR: ZIP تالف: {bad_file}'
                      )

                  for info in archive.infolist():
                      path = PurePosixPath(info.filename)

                      if path.is_absolute() or '..' in path.parts:
                          raise SystemExit(
