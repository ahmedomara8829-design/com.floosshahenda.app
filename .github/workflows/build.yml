name: Build Floos Shahenda

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - 'source/*.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate and safely extract latest source ZIP
        run: |
          python3 - <<'PY'
          import hashlib
          import re
          import shutil
          import zipfile
          from pathlib import Path, PurePosixPath

          # The repository may keep previous ZIPs.
          # Select the highest semantic version from names such as:
          # floos_shahenda_v1.0.0.zip
          # floos_shahenda_v1.1.0.zip
          candidates = sorted(Path('.').glob('*.zip')) + sorted(Path('source').glob('*.zip'))

          versioned = []
          pattern = re.compile(
              r'^floos_shahenda_v(\d+)\.(\d+)\.(\d+)\.zip$',
              re.IGNORECASE
          )

          for p in candidates:
              m = pattern.match(p.name)
              if m:
                  version = tuple(int(x) for x in m.groups())
                  versioned.append((version, p))

          if not versioned:
              raise SystemExit(
                  'ERROR: لم يتم العثور على ZIP صالح باسم '
                  'floos_shahenda_vMAJOR.MINOR.PATCH.zip'
              )

          versioned.sort(key=lambda item: (item[0], str(item[1])))

          latest_version = versioned[-1][0]
          latest = [p for v, p in versioned if v == latest_version]

          if len(latest) > 1:
              raise SystemExit(
                  f'ERROR: يوجد أكثر من ZIP لنفس الإصدار '
                  f'v{latest_version[0]}.{latest_version[1]}.{latest_version[2]}. '
                  f'احذف/أعد تسمية النسخة المكررة قبل البناء.'
              )

          z = latest[0]
          print(
              f'Selected source ZIP: {z} '
              f'(version v{latest_version[0]}.{latest_version[1]}.{latest_version[2]})'
          )

          work = Path('.ci_workspace')
          if work.exists():
              shutil.rmtree(work)

          project = work / 'project'
          project.mkdir(parents=True)

          MAX_SIZE = 800 * 1024 * 1024
          total = 0

          try:
              with zipfile.ZipFile(z) as archive:
                  bad = archive.testzip()
                  if bad:
                      raise SystemExit(f'ERROR: ZIP تالف: {bad}')

                  for info in archive.infolist():
                      p = PurePosixPath(info.filename)

                      if p.is_absolute() or '..' in p.parts:
                          raise SystemExit(
                              f'ERROR: مسار غير آمن داخل ZIP: {info.filename}'
                          )

                      total += info.file_size
                      if total > MAX_SIZE:
                          raise SystemExit(
                              'ERROR: الحجم بعد فك الضغط أكبر من الحد المسموح.'
                          )

                  archive.extractall(project)

          except zipfile.BadZipFile:
              raise SystemExit('ERROR: ملف ZIP غير صالح أو تالف.')

          roots = []

          if (project / 'pubspec.yaml').is_file() and (project / 'lib').is_dir():
              roots.append(project)

          for child in project.iterdir():
              if child.is_dir() and \
                 (child / 'pubspec.yaml').is_file() and \
                 (child / 'lib').is_dir():
                  roots.append(child)

          if len(roots) != 1:
              raise SystemExit(
                  'ERROR: لم يتم العثور على Root واحد لمشروع Flutter صالح داخل ZIP.'
              )

          root = roots[0]
          app = work / 'app'
          shutil.move(str(root), str(app))

          print('ZIP SHA256:', hashlib.sha256(z.read_bytes()).hexdigest())
          print('Detected project root:', app)
          PY

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform if needed
        working-directory: .ci_workspace/app
        run: |
          if [ ! -d android ]; then
            flutter create \
              --platforms=android \
              --org com.floosshahenda \
              --project-name floos_shahenda .
          fi

      - name: Enforce permanent Application ID
        working-directory: .ci_workspace/app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil

          android = Path('android')
          old = 'com.floosshahenda.floos_shahenda'
          new = 'com.floosshahenda.app'

          for p in android.rglob('*'):
              if p.is_file() and p.suffix in {'.kt', '.java', '.gradle', '.kts', '.xml'}:
                  try:
                      s = p.read_text(encoding='utf-8')
                  except UnicodeDecodeError:
                      continue
                  if old in s:
                      p.write_text(s.replace(old, new), encoding='utf-8')

          old_dir = android / 'app' / 'src' / 'main' / 'kotlin' / 'com' / 'floosshahenda' / 'floos_shahenda'
          new_dir = android / 'app' / 'src' / 'main' / 'kotlin' / 'com' / 'floosshahenda' / 'app'

          if old_dir.exists():
              new_dir.parent.mkdir(parents=True, exist_ok=True)
              if new_dir.exists():
                  shutil.rmtree(new_dir)
              shutil.move(str(old_dir), str(new_dir))

          found = False
          for p in android.rglob('*'):
              if p.is_file() and p.suffix in {'.kt', '.java', '.gradle', '.kts', '.xml'}:
                  try:
                      if new in p.read_text(encoding='utf-8'):
                          found = True
                          break
                  except UnicodeDecodeError:
                      pass

          if not found:
              raise SystemExit(
                  'ERROR: Application ID com.floosshahenda.app '
                  'لم يتم تثبيته في Android project.'
              )
          PY

      - name: Install dependencies
        working-directory: .ci_workspace/app
        run: flutter pub get

      - name: Generate Drift database code
        working-directory: .ci_workspace/app
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Prepare CI smoke test
        working-directory: .ci_workspace/app
        run: |
          rm -f test/widget_test.dart
          mkdir -p test
          cat > test/smoke_test.dart <<'DART'
          import 'package:flutter_test/flutter_test.dart';
          import 'package:floos_shahenda/app.dart';

          void main() {
            testWidgets('Floos Shahenda app starts', (tester) async {
              await tester.pumpWidget(const FloosShahendaApp());
              expect(find.text('💰 فلوس شاهندة'), findsOneWidget);
            });
          }
          DART

      - name: Static analysis
        working-directory: .ci_workspace/app
        run: flutter analyze

      - name: Tests
        working-directory: .ci_workspace/app
        run: flutter test

      - name: Build APK
        working-directory: .ci_workspace/app
        run: flutter build apk --release

      - name: Build AAB
        working-directory: .ci_workspace/app
        run: flutter build appbundle --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: floos-shahenda-apk
          path: .ci_workspace/app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: floos-shahenda-aab
          path: .ci_workspace/app/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
